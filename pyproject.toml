[build-system]
requires = [ "setuptools>=84.0.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "salesforce-agent"
version = "2.3.1"
description = "Salesforce REST/SOQL/Bulk API 2.0 connector + MCP Server + A2A Server for Agentic AI!"
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
dependencies = [ "agent-connector-sdk[mcp]>=0.3.18,<1.0.0", "httpx>=0.28.1",]
[[project.authors]]
name = "Project Maintainers"
email = "maintainers@users.noreply.github.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [ "agent-connector-sdk[mcp]>=0.3.18,<1.0.0",]
jwt = [ "cryptography>=50.0.2",]
all = [ "agent-connector-sdk[mcp]>=0.3.18,<1.0.0", "cryptography>=50.0.2",]
test = [ "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0", "cryptography>=50.0.2",]

[project.scripts]
salesforce-mcp = "salesforce_agent.mcp_server:mcp_server"

[project.entry-points."agent_connector_sdk.skill_providers"]
salesforce-agent = "salesforce_agent.skills"

[project.entry-points."agent_connector_sdk.ontology_providers"]
salesforce-agent = "salesforce_agent.ontology"

[project.entry-points."agent_connector_sdk.source_connector_providers"]
salesforce-agent = "salesforce_agent.connectors"

[project.entry-points."agent_connector_sdk.prompt_providers"]
salesforce-agent = "salesforce_agent.prompts"

# The one declared connector identity: the fleet name (SDK-CONNECTOR-CONTROL-R071).
[project.entry-points."agent_connector_sdk.connector"]
salesforce-mcp = "salesforce_agent"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [ "pytest-timeout>=2.4.0",]

[tool.setuptools.package-data]
salesforce_agent = [ "mcp_config.json", "agent_data/**", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]
include = [ "salesforce_agent*",]

[tool.vulture]
ignore_names = ["request", "config", "exc_info"]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]
